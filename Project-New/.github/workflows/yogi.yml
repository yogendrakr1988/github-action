name: Terraform Feature Branch - Plan

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 'Project-New/Parent Module'

    steps:

      # =========================================================
      # STEP 1 - Checkout Repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # STEP 2 - Setup Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      # =========================================================
      # STEP 3 - Azure Login Using Service Principal
      # =========================================================
      - name: Azure Login Using Service Principal
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          az account set \
            --subscription "$AZURE_SUBSCRIPTION_ID"


      # =========================================================
      # STEP 4 - Verify Azure Subscription
      # =========================================================
      - name: Verify Azure Login
        run: az account show --output table


      # =========================================================
      # STEP 5 - Terraform Format Check
      # =========================================================
      - name: Terraform Format Check
        run: terraform fmt -recursive


      # =========================================================
      # STEP 6 - Terraform Init
      # =========================================================
      - name: Terraform Init
        run: terraform init -input=false


      # =========================================================
      # STEP 7 - Terraform Validate
      # =========================================================
      - name: Terraform Validate
        run: terraform validate


      # =========================================================
      # STEP 8 - Terraform Plan
      # =========================================================
      - name: Terraform Plan
        run: terraform plan -input=false -no-color