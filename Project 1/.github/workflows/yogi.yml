name: Terraform Plan

on:
  push:
    branches:
      - 'feature/**'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED for OIDC login — without this, azure/login fails

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 'Project 1/Parent Module'

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Azure Login (OIDC — no username/password, no client secret)
      #
      # The old `az login --username --password` approach gets stuck
      # because it needs interactive MFA on almost every real Azure AD
      # account today, and Microsoft has been deprecating that
      # non-interactive basic-auth flow. This does NOT need YOU to have
      # any Azure Portal rights. An admin does a ONE-TIME setup:
      #   1. az ad app create + az ad sp create
      #   2. az ad app federated-credential create (trusts this GitHub repo)
      #   3. az role assignment create --role Contributor --scope <your RG>
      #      (only least-privilege scope, not Owner / subscription-wide)
      # Then the pipeline authenticates with just three IDs below — no
      # password ever touches GitHub secrets.
      # -------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        shell: bash
        run: |
          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table

      # -------------------------------------------------
      # Terraform
      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.2

      # -------------------------------------------------
      # Terraform Init
      # -------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------
      - name: Terraform Plan
        run: terraform plan